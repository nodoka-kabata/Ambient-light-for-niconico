<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>アンビエントライト</title>
  <style>
    body { width: 280px; margin: 0; padding: 16px; color: #eee; background: #202124; font: 14px system-ui, sans-serif; }
    h1 { margin: 0 0 14px; font-size: 16px; }
    h2 { margin: 16px 0 8px; color: #bbb; font-size: 12px; font-weight: 600; }
    label { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 12px 0; }
    input[type="range"] { width: 130px; accent-color: #9b7cff; }
    input[type="checkbox"] { accent-color: #9b7cff; }
    select { max-width: 165px; padding: 5px; color: #eee; background: #3a3b3c; border: 0; border-radius: 6px; }
    output { display: inline-block; width: 36px; color: #bbb; text-align: right; }
    .row { display: flex; align-items: center; gap: 8px; }
    #status { min-height: 1.2em; margin-top: 12px; color: #aaa; font-size: 12px; }
  </style>
</head>
<body>
  <h1>アンビエントライト</h1>
  <label>有効にする <input id="enabled" type="checkbox"></label>
  <label>表示方式 <select id="mode"><option value="glow">プレイヤー周囲</option><option value="full">画面全体をぼかす</option></select></label>
  <label>ぼかし <span class="row"><input id="blur" type="range" min="8" max="72" step="1"><output></output></span></label>
  <label>広がり <span class="row"><input id="spread" type="range" min="1" max="1.6" step="0.01"><output></output></span></label>
  <label>フェード時間 <span class="row"><input id="fade" type="range" min="0" max="1000" step="50"><output></output></span></label>
  <h2>映像フィルター</h2>
  <label>明るさ <span class="row"><input id="brightness" type="range" min="50" max="150" step="1"><output></output></span></label>
  <label>コントラスト <span class="row"><input id="contrast" type="range" min="50" max="150" step="1"><output></output></span></label>
  <label>彩度 <span class="row"><input id="saturation" type="range" min="0" max="200" step="1"><output></output></span></label>
  <div id="status" role="status"></div>
  <script src="popup.js"></script>
</body>
</html>
